[project]
name = "lead-engine"
version = "0.1.0"
description = "Source-verified B2B leads: find owner-run businesses, prove the decision-maker from their own site, write an evidence-backed opener, gate it and hand it to the email platform."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daymion Alvarez" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]
